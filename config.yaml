# Lunar Ice Detection System Configuration
# Based on PS-8 Chandrayaan-2 Lunar Ice Detection Problem Statement

# Data paths
data:
  dem_dir: "data/dem"
  radar_dir: "data/radar"
  ohrc_dir: "data/ohrc"
  output_dir: "data/output"

# Illumination modelling parameters
illumination:
  # Solar ephemeris - lunar south pole specific
  latitude: -90.0  # South pole
  longitude: 0.0
  # Illumination cycle: full lunar day (29.53 Earth days)
  cycle_days: 29.53
  # Time step for ray tracing (hours)
  time_step_hours: 1.0
  # DEM resolution
  tm2_resolution: 5.0  # meters (TMC-2 regional DEM)
  ohrc_resolution: 0.5  # meters (OHRC stereo DEM, sub-meter)
  # Shadow definitions
  direct_illumination_threshold: 0.0  # degrees
  # Secondary illumination: terrain-reflected light
  secondary_illumination_angle: 5.0  # degrees above horizon
  # Doubly shadowed = never direct AND never secondary
  doubly_shadowed_criteria:
    max_direct_fraction: 0.0
    max_secondary_fraction: 0.0

# Radar (DFSAR) parameters
radar:
  bands: ["L", "S"]
  # Full polarimetric data
  polarization: "full-pol"
  # CPR threshold for ice detection
  cpr_threshold: 1.0
  # DOP threshold (from multi-parameter lunar radar studies)
  dop_threshold: 0.3
  # Minimum passes for repeat-pass consistency
  min_passes: 2
  # Agreement threshold for repeat-pass validation
  agreement_threshold: 0.6  # fraction of passes meeting criteria
  # Backscatter parameters
  backscatter_percentile_low: 5
  backscatter_percentile_high: 95

# Optical (OHRC) morphology parameters
optical:
  # Freshness/roughness indicators
  local_variance_window: 15  # pixels
  edge_detection_threshold: 0.5
  boulder_detection:
    min_area_pixels: 9
    max_area_pixels: 500
    intensity_threshold: 0.7
  # Texture measures
  glcm_distances: [1, 3, 5]
  glcm_angles: [0, 45, 90, 135]

# Fusion parameters
fusion:
  # Weights for composite ice-likelihood score
  weights:
    cpr: 0.35
    dop: 0.25
    backscatter: 0.20
    freshness_suppression: -0.20  # negative = suppression term
  # Score normalization
  score_min: 0.0
  score_max: 1.0
  # High confidence threshold
  high_confidence_threshold: 0.7

# Volume estimation parameters
volume:
  # Depth scope (from problem statement)
  depth_meters: 5.0
  # Dielectric mixing model: "maxwell-garnett" or "bruggeman"
  mixing_model: "maxwell-garnett"
  # Dielectric constants (literature ranges)
  dielectric:
    regolith:
      min: 2.5
      max: 3.5
      nominal: 3.0
    ice:
      min: 3.1
      max: 3.2
      nominal: 3.15
  # Uncertainty propagation
  uncertainty_samples: 1000

# Landing site and traverse planning
planning:
  # Landing site ranking weights
  landing_weights:
    ice_proximity: 0.40
    slope_safety: 0.30
    illumination: 0.30
  # Safety thresholds
  max_slope_degrees: 15.0
  min_illumination_fraction: 0.7  # lander needs power
  # Search radius for landing sites (meters)
  search_radius_meters: 5000.0
  # Rover traverse parameters
  traverse:
    max_slope_degrees: 20.0
    hazard_penalty_weight: 2.0
    ice_region_penalty: 10.0  # penalty for leaving validated ice region
    grid_resolution: 10.0  # meters
  # Number of top landing sites to rank
  top_n_sites: 5

# Output deliverables
outputs:
  ice_probability_map: "ice_probability_map.tif"
  radar_framework_doc: "radar_detection_framework.md"
  landing_site_shortlist: "landing_site_shortlist.csv"
  rover_traverse_path: "rover_traverse_path.geojson"
  volume_estimate: "volume_estimate.json"
  validation_report: "validation_report.md"